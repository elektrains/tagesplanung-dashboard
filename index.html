<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elektra Ins – Werkstatt-Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;--bg4:#2a2f45;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --text:#e8eaf0;--text2:#9aa0b8;--text3:#6b7291;
  --accent:#cc1418;--accent2:#a50f12;--accent-glow:rgba(204,20,24,0.2);
  --green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;
  --green-bg:rgba(34,197,94,0.20);--yellow-bg:rgba(234,179,8,0.25);
  --red-bg:rgba(239,68,68,0.25);--blue-bg:rgba(59,130,246,0.25);
  --radius:8px;--radius-lg:12px;
  /* Alles skaliert über diesen Faktor. Die App regelt ihn selbst herunter,
     wenn ein Tag mehr Zeilen hat als auf den Schirm passen. Startwert über
     die Adresse justierbar: ...?scale=2.4 — bleibt im Gerät gespeichert. */
  --s:1.6;
}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
  font-size:calc(13px * var(--s));
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}

/* ===== Kopfzeile ===== */
.topbar{background:#111318;border-bottom:calc(2px * var(--s)) solid var(--accent);
  display:flex;align-items:center;gap:calc(14px * var(--s));
  padding:calc(10px * var(--s)) calc(18px * var(--s));flex-shrink:0;}
.marke{font-size:calc(12px * var(--s));font-weight:700;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;line-height:1.25;flex-shrink:0;white-space:nowrap;}
.marke span{display:block;font-size:calc(9px * var(--s));font-weight:400;color:var(--text3);letter-spacing:1px;}
.tag-nav{display:flex;align-items:center;gap:calc(8px * var(--s));margin-left:calc(10px * var(--s));}
/* Reiter in eigener Zeile unter der Kopfzeile: zu dritt passten sie dort
   nicht mehr neben Datum, Uhr und Status. Volle Breite heisst nebenbei
   grosse Flaechen zum Antippen. Die Zeile erscheint nur, wenn es etwas zu
   zeigen gibt. */
.reiter{display:none;gap:calc(6px * var(--s));background:#111318;flex-shrink:0;
  padding:calc(7px * var(--s)) calc(18px * var(--s));border-bottom:1px solid var(--border);}
.reiter-btn{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text3);cursor:pointer;
  padding:calc(9px * var(--s)) calc(13px * var(--s));border-radius:var(--radius);
  font-size:calc(12px * var(--s));font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  min-height:calc(44px * var(--s));white-space:nowrap;}
.reiter-btn.aktiv{background:var(--accent);border-color:var(--accent);color:#fff;}
.nav-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;
  padding:calc(8px * var(--s)) calc(16px * var(--s));border-radius:var(--radius);
  font-size:calc(15px * var(--s));min-width:calc(46px * var(--s));min-height:calc(44px * var(--s));}
.nav-btn:active{background:var(--accent);border-color:var(--accent);color:#fff;}
.nav-btn.klein{font-size:calc(12px * var(--s));}
.tag-text{line-height:1.2;}
.tag-wochentag{font-size:calc(17px * var(--s));font-weight:700;}
.tag-datum{font-size:calc(12px * var(--s));color:var(--text3);}
.kopf-rechts{margin-left:auto;display:flex;align-items:center;gap:calc(10px * var(--s));}
.uhr{font-size:calc(16px * var(--s));font-weight:700;font-variant-numeric:tabular-nums;}
.status{display:flex;align-items:center;gap:calc(6px * var(--s));padding:calc(5px * var(--s)) calc(11px * var(--s));
  border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);
  font-size:calc(11px * var(--s));color:var(--text2);white-space:nowrap;}
.status-punkt{width:calc(8px * var(--s));height:calc(8px * var(--s));border-radius:50%;background:var(--text3);flex-shrink:0;}
.status-punkt.on{background:var(--green);box-shadow:0 0 calc(6px * var(--s)) var(--green);}
.status-punkt.off{background:var(--red);}
.rueck-hinweis{display:none;font-size:calc(11px * var(--s));color:var(--text3);
  background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);
  padding:calc(5px * var(--s)) calc(11px * var(--s));white-space:nowrap;}
.rueck-hinweis.on{display:block;}
/* Laeuft der Countdown, tritt er an die Stelle von Uhr und Status: sonst
   wird die Kopfzeile breiter als der Schirm und schiebt beides hinaus. */
.rueck-hinweis.on ~ .uhr,.rueck-hinweis.on ~ .status{display:none;}

/* ===== Grundraster ===== */
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.inhalt{flex:1;display:grid;overflow:hidden;min-height:0;}
/* Hochformat: drei Bereiche untereinander. Querformat: Plan links, die
   beiden Listen rechts — sonst bliebe der Plan ein schmaler Streifen. */
/* Plan oben, gedeckelt auf knapp die halbe Hoehe. Was darunter frei bleibt,
   teilen sich Aufgaben und Infoboard. */
/* Plan, Ämtli-Zeile, Aufgaben und die Termine unten so hoch wie ihr Inhalt;
   was frei bleibt, faellt ans Infoboard. */
.inhalt{grid-template-rows:auto auto auto minmax(0,1fr) auto;}
/* Aufgaben so hoch wie ihr Inhalt, der freie Rest faellt ans Infoboard —
   dort wirkt er wie Platz fuer weitere Mitteilungen statt wie ein Loch. */

.block{border-top:calc(2px * var(--s)) solid var(--border2);background:var(--bg2);
  padding:calc(10px * var(--s)) calc(18px * var(--s)) calc(12px * var(--s));
  display:flex;flex-direction:column;min-height:0;}
.block-kopf{display:flex;align-items:center;gap:calc(10px * var(--s));margin-bottom:calc(8px * var(--s));flex-shrink:0;}
.block-titel{font-size:calc(12px * var(--s));font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);}
.block-zahl{font-size:calc(10px * var(--s));color:var(--text3);background:var(--bg3);
  border:1px solid var(--border);border-radius:99px;padding:calc(2px * var(--s)) calc(10px * var(--s));white-space:nowrap;}
.block-liste{overflow:hidden;display:flex;flex-direction:column;gap:calc(6px * var(--s));}
.leer{padding:calc(12px * var(--s));text-align:center;color:var(--text3);font-size:calc(12px * var(--s));}

/* ===== Ämtli ===== */
.inhalt-liste{flex:1;display:none;flex-direction:column;overflow:hidden;min-height:0;}
.amt{display:flex;align-items:center;gap:calc(12px * var(--s));
  background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);
  padding:calc(8px * var(--s)) calc(12px * var(--s));}
.amt-text{flex:1;min-width:0;}
.amt-titel{font-weight:600;font-size:calc(14px * var(--s));}
.amt-zeit{font-size:calc(11px * var(--s));color:var(--text3);margin-top:calc(2px * var(--s));}
.amt-wer{display:flex;align-items:center;gap:calc(6px * var(--s));flex-wrap:wrap;flex-shrink:0;}
.amt-gruppe{margin-bottom:calc(12px * var(--s));display:flex;flex-direction:column;gap:calc(5px * var(--s));}
.amt-tag{font-size:calc(11px * var(--s));font-weight:700;text-transform:uppercase;letter-spacing:1px;
  color:var(--text3);padding-bottom:calc(2px * var(--s));}
.amt-gruppe.heute .amt-tag{color:#ff8a8d;}
.amt-gruppe.heute .amt{border-color:var(--accent);}

/* ===== Termine ===== */
.termin{display:flex;align-items:center;gap:calc(12px * var(--s));
  background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);
  padding:calc(8px * var(--s)) calc(12px * var(--s));}
.termin.heute{border-color:var(--red);background:var(--red-bg);}
.termin-datum{font-size:calc(12px * var(--s));font-weight:700;color:var(--text2);
  font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0;
  display:flex;align-items:baseline;gap:calc(6px * var(--s));}
.termin-wt{font-size:calc(11px * var(--s));color:var(--text3);font-weight:600;}
.termin.heute .termin-datum,.termin.heute .termin-titel{color:var(--red);}
.termin.heute .termin-wt{color:var(--red);}
.termin-text{flex:1;min-width:0;}
.termin-titel{font-weight:600;font-size:calc(14px * var(--s));}
.termin-zeit{font-size:calc(11px * var(--s));color:var(--text3);margin-top:calc(2px * var(--s));}

/* ===== Tagesplan: die gewohnte Matrix ===== */
/* Der Plan bekommt hoechstens knapp die halbe Hoehe. Passt die Tabelle
   nicht hinein, wird NUR sie verkleinert (transform), nicht die ganze
   Seite — sonst schrumpften Aufgaben und Infoboard unnoetig mit. */
.plan-box{overflow:hidden;padding:calc(10px * var(--s)) calc(14px * var(--s));
  max-height:48vh;display:flex;align-items:flex-start;}
.plan-fit{transform-origin:top left;}
.plan-table{border-collapse:separate;border-spacing:0;border-radius:var(--radius-lg);
  overflow:hidden;border:1px solid var(--border);background:var(--bg2);}
.plan-table th{background:var(--bg3);color:var(--text3);font-size:calc(11px * var(--s));
  font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:0;text-align:center;
  border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:bottom;}
.plan-table th.sp-bau{text-align:left;padding:0 calc(10px * var(--s)) calc(8px * var(--s));}
.plan-table th.sp-fz{padding:0 0 calc(8px * var(--s));}
.plan-table td{padding:0;border-bottom:1px solid var(--border);vertical-align:middle;}
.plan-table tr:last-child td{border-bottom:none;}
.bau{padding:calc(6px * var(--s)) calc(10px * var(--s));font-size:calc(14px * var(--s));
  font-weight:500;line-height:1.25;}
.bau-leer{color:var(--text3);font-style:italic;font-weight:400;}
.fz-zelle{padding:calc(4px * var(--s)) calc(7px * var(--s));text-align:center;}
.fz{display:inline-block;font-size:calc(12px * var(--s));font-weight:600;color:var(--text2);
  background:var(--bg4);border:1px solid var(--border);border-radius:calc(4px * var(--s));
  padding:calc(2px * var(--s)) calc(8px * var(--s));white-space:nowrap;}
.mz{border-left:1px solid var(--border);text-align:center;padding:calc(4px * var(--s)) calc(2px * var(--s));}
.mz.s-absent{background:var(--red-bg);}
.mz.s-school{background:var(--blue-bg);}
.mz.s-half{background:var(--yellow-bg);}
.mz.drin{background:rgba(234,179,8,.28);}
.mz.s-absent.drin{background:var(--red-bg);}
.mz.s-school.drin{background:var(--blue-bg);}
.mark{font-size:calc(14px * var(--s));font-weight:700;color:var(--text);}
.mz.s-absent .mark{color:var(--red);}
.mz.s-school .mark{color:var(--blue);}
.mz.s-half .mark{color:var(--yellow);}
.kopf-wrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:calc(4px * var(--s));padding:calc(4px * var(--s)) calc(2px * var(--s));height:calc(92px * var(--s));}
.kopf-name{font-size:calc(12px * var(--s));white-space:nowrap;writing-mode:vertical-rl;
  transform:rotate(180deg);max-height:calc(82px * var(--s));overflow:hidden;}
.kopf-punkt{width:calc(8px * var(--s));height:calc(8px * var(--s));border-radius:50%;}
/* Logo sitzt in der ersten Kopfzelle, ueber dem Wort "Baustelle". Die Zelle
   ist ohnehin hoch, weil die Mitarbeiternamen senkrecht stehen. */
.sp-bau-inner{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;
  height:calc(92px * var(--s));padding:calc(6px * var(--s)) 0 calc(8px * var(--s));}
.plan-logo{height:calc(38px * var(--s));width:auto;display:block;border-radius:calc(3px * var(--s));}

/* ===== Fragen zur Anmeldung ===== */
.frage{margin-bottom:calc(14px * var(--s));}
.frage-label{font-size:calc(13px * var(--s));font-weight:700;margin-bottom:calc(6px * var(--s));}
.frage-opts{display:flex;gap:calc(8px * var(--s));flex-wrap:wrap;}
.opt{background:var(--bg3);border:calc(2px * var(--s)) solid var(--border);color:var(--text2);
  cursor:pointer;padding:calc(10px * var(--s)) calc(18px * var(--s));border-radius:var(--radius);
  font-size:calc(13px * var(--s));font-weight:600;min-height:calc(46px * var(--s));}
.opt.sel{background:var(--accent);border-color:var(--accent);color:#fff;}
.dialog-fuss{display:flex;justify-content:space-between;gap:calc(8px * var(--s));flex-shrink:0;}
.dialog-koerper{overflow-y:auto;margin-bottom:calc(14px * var(--s));}
.aus{display:flex;gap:calc(5px * var(--s));flex-wrap:wrap;margin-top:calc(6px * var(--s));}
/* ===== Aufgaben ===== */
.auf{display:flex;align-items:flex-start;gap:calc(12px * var(--s));
  padding:calc(9px * var(--s)) calc(12px * var(--s));border-radius:var(--radius);
  background:var(--bg3);border:1px solid transparent;cursor:pointer;}
.auf:active{background:var(--bg4);border-color:var(--accent);}
.auf.spaet{background:var(--red-bg);border-color:var(--red);}
.auf-haken{width:calc(26px * var(--s));height:calc(26px * var(--s));min-width:calc(26px * var(--s));
  border:calc(2px * var(--s)) solid var(--text3);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:calc(15px * var(--s));color:transparent;}
.auf-text{flex:1;min-width:0;}
.auf-titel{font-weight:600;font-size:calc(14px * var(--s));}
.auf-besch{font-size:calc(12px * var(--s));color:var(--text2);margin-top:calc(2px * var(--s));}
.auf-meta{display:flex;align-items:center;gap:calc(6px * var(--s));flex-wrap:wrap;flex-shrink:0;}
.chip{font-size:calc(11px * var(--s));background:var(--bg4);border:1px solid var(--border2);color:var(--text2);
  padding:calc(2px * var(--s)) calc(10px * var(--s));border-radius:99px;white-space:nowrap;}
.chip.rot{background:var(--red);border-color:var(--red);color:#fff;font-weight:700;}
.chip.person{background:var(--accent-glow);border-color:var(--accent);color:#ff8a8d;font-weight:600;}
.auf.fertig{opacity:.45;background:var(--bg2);}
.auf.fertig .auf-titel,.auf.fertig .auf-besch{text-decoration:line-through;}
.auf.fertig .auf-haken{border-color:var(--green);background:var(--green);color:#fff;}
.auf.fertig.spaet{background:var(--bg2);border-color:transparent;}
.auf-wann{font-size:calc(10px * var(--s));color:var(--text3);margin-top:calc(3px * var(--s));}

/* ===== Infoboard ===== */
.info{background:var(--bg3);border-radius:var(--radius);border-left:calc(5px * var(--s)) solid var(--accent);
  padding:calc(9px * var(--s)) calc(13px * var(--s));}
.info-kopf{display:flex;align-items:baseline;gap:calc(10px * var(--s));flex-wrap:wrap;}
.info-titel{font-size:calc(15px * var(--s));font-weight:700;}
.info-text{font-size:calc(13px * var(--s));color:var(--text2);margin-top:calc(3px * var(--s));white-space:pre-wrap;}
.info-anmeldung{display:flex;align-items:center;gap:calc(8px * var(--s));
  margin-top:calc(8px * var(--s));flex-wrap:wrap;}
.info-namen{display:flex;gap:calc(5px * var(--s));flex-wrap:wrap;}
.knopf{background:var(--accent);border:none;color:#fff;cursor:pointer;font-weight:700;
  padding:calc(8px * var(--s)) calc(16px * var(--s));border-radius:var(--radius);
  font-size:calc(12px * var(--s));min-height:calc(40px * var(--s));white-space:nowrap;}
.knopf:active{background:var(--accent2);}
.knopf.leise{background:var(--bg4);color:var(--text2);border:1px solid var(--border2);font-weight:600;}

/* ===== Namensauswahl ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:500;
  display:none;align-items:center;justify-content:center;padding:calc(20px * var(--s));}
.overlay.on{display:flex;}
.dialog{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);
  padding:calc(20px * var(--s));width:100%;max-width:calc(560px * var(--s));max-height:88vh;
  display:flex;flex-direction:column;}
.dialog-titel{font-size:calc(16px * var(--s));font-weight:700;margin-bottom:calc(4px * var(--s));}
.dialog-sub{font-size:calc(12px * var(--s));color:var(--text2);margin-bottom:calc(14px * var(--s));}
.namen-gitter{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(8px * var(--s));
  overflow-y:auto;margin-bottom:calc(14px * var(--s));}
.name-knopf{background:var(--bg3);border:calc(2px * var(--s)) solid var(--border);color:var(--text2);
  cursor:pointer;padding:calc(12px * var(--s)) calc(8px * var(--s));border-radius:var(--radius);
  font-size:calc(13px * var(--s));font-weight:600;min-height:calc(50px * var(--s));
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.name-knopf.drin{background:var(--green-bg);border-color:var(--green);color:var(--green);}
.dialog-fuss{display:flex;justify-content:flex-end;flex-shrink:0;}

/* ===== Start / Meldung ===== */
.loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:calc(16px * var(--s));z-index:9999;}
.loader-text{color:var(--text2);font-size:calc(14px * var(--s));}
.loader-sub{color:var(--text3);font-size:calc(11px * var(--s));max-width:60ch;text-align:center;line-height:1.6;}
.spinner{width:calc(32px * var(--s));height:calc(32px * var(--s));border:calc(3px * var(--s)) solid var(--border2);
  border-top-color:var(--accent);border-radius:50%;animation:dreh .8s linear infinite;}
@keyframes dreh{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:calc(20px * var(--s));right:calc(20px * var(--s));background:var(--bg2);
  border:1px solid var(--border2);border-radius:var(--radius);padding:calc(12px * var(--s)) calc(18px * var(--s));
  font-size:calc(12px * var(--s));z-index:9999;display:none;max-width:70vw;}
.toast.err{border-color:var(--red);}
.toast.ok{border-color:var(--green);}
::-webkit-scrollbar{width:calc(6px * var(--s));height:calc(6px * var(--s));}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:99px;}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <div class="loader-text">Verbinde…</div>
  <div class="loader-sub" id="loaderSub"></div>
</div>

<div class="shell" id="shell" style="display:none">
  <div class="topbar">
    <div class="marke">Infoboard<span>Elektra Ins AG</span></div>
    <div class="tag-nav">
      <button class="nav-btn" onclick="tagWechseln(-1)">‹</button>
      <button class="nav-btn klein" onclick="aufHeute()">Heute</button>
      <button class="nav-btn" onclick="tagWechseln(1)">›</button>
    </div>
    <div class="tag-text">
      <div class="tag-wochentag" id="wochentag">—</div>
      <div class="tag-datum" id="datum">—</div>
    </div>
    <div class="kopf-rechts">
      <div class="rueck-hinweis" id="rueckHinweis"></div>
      <div class="uhr" id="uhr">--:--</div>
      <div class="status"><div class="status-punkt" id="statusPunkt"></div><span id="statusText">Verbinde…</span></div>
    </div>
  </div>

  <div class="reiter" id="reiter">
    <button class="reiter-btn aktiv" id="reiterPlan" onclick="ansichtWechseln('plan')">Plan</button>
    <button class="reiter-btn" id="reiterTermine" onclick="ansichtWechseln('termine')">Termine</button>
    <button class="reiter-btn" id="reiterAemtli" onclick="ansichtWechseln('aemtli')">Ämtli</button>
  </div>

  <div class="inhalt" id="ansichtPlan">
    <div class="plan-box"><div class="plan-fit" id="planFit"></div></div>

    <div class="block" id="blockAemtliHeute" style="display:none">
      <div class="block-kopf">
        <div class="block-titel" id="aemtliHeuteTitel">Ämtli</div>
      </div>
      <div class="block-liste" id="aemtliHeuteListe"></div>
    </div>

    <div class="block" id="blockAufgaben">
      <div class="block-kopf">
        <div class="block-titel">Aufgaben</div>
        <div class="block-zahl" id="aufgabenZahl"></div>
      </div>
      <div class="block-liste" id="aufgabenListe"></div>
    </div>

    <div class="block" id="blockInfo">
      <div class="block-kopf">
        <div class="block-titel">Infoboard</div>
        <div class="block-zahl" id="infoZahl"></div>
      </div>
      <div class="block-liste" id="infoListe"></div>
    </div>

    <div class="block" id="blockTermine" style="display:none">
      <div class="block-kopf">
        <div class="block-titel">Termine</div>
        <div class="block-zahl">kommende Woche</div>
      </div>
      <div class="block-liste" id="termineHeuteListe"></div>
    </div>
  </div>

  <div class="inhalt-liste" id="ansichtTermine">
    <div class="block" style="border-top:none;flex:1;min-height:0">
      <div class="block-kopf">
        <div class="block-titel">Termine – was noch kommt</div>
        <div class="block-zahl" id="termineZahl"></div>
      </div>
      <div class="block-liste" id="termineListe" style="overflow:hidden"></div>
    </div>
  </div>

  <div class="inhalt-liste" id="ansichtAemtli">
    <div class="block" style="border-top:none;flex:1;min-height:0">
      <div class="block-kopf">
        <div class="block-titel">Ämtli – wer ist zuständig</div>
        <div class="block-zahl" id="aemtliZahl"></div>
      </div>
      <div class="block-liste" id="aemtliListe" style="overflow:hidden"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="dialog">
    <div class="dialog-titel" id="dialogTitel"></div>
    <div class="dialog-sub" id="dialogSub"></div>
    <div class="dialog-koerper" id="dialogKoerper"></div>
    <div class="dialog-fuss" id="dialogFuss"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// =====================================================================
// Werkstatt-Dashboard — Wandbildschirm, vorgesehen im Hochformat.
// Liest denselben Firebase-Stand wie Tagesplanung und Reading; schreibt
// ausschliesslich in werkstattAufgaben und infoboard. Der Tagesplan ist
// hier unveränderbar: es gibt keine Funktion, die ihn anfassen könnte.
//
// Statt der Matrix aus der Management-App steht hier eine Zeile pro
// Mitarbeiter. Auf 68,5 cm Breite im Hochformat hätten 18 Spalten
// rechnerisch 3,8 cm je Spalte — das liest aus zwei Metern niemand mehr.
// =====================================================================

const firebaseConfig = {
  apiKey: "AIzaSyBR_zR1xGUBOFWB4_14yK5yeIlC54VHAHo",
  authDomain: "elektra-tagesplanung-23b62.firebaseapp.com",
  databaseURL: "https://elektra-tagesplanung-23b62-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "elektra-tagesplanung-23b62",
  storageBucket: "elektra-tagesplanung-23b62.firebasestorage.app",
  messagingSenderId: "1026963459245",
  appId: "1:1026963459245:web:6a5aeaed0afd8ade37ca24"
};
// Eigene Firebase-Instanz unter eigenem Namen. Management, Reading und dieses
// Dashboard liegen alle auf elektrains.github.io, und Firebase legt die
// Anmeldung pro Herkunft UND App-Name ab. Ohne eigenen Namen landete die
// anonyme Anmeldung von hier im selben Speicher wie der Projektleiter-Login
// der Management-App — die hielt sie dann faelschlich fuer einen Login.
const app = firebase.initializeApp(firebaseConfig, "werkstatt-dashboard");
const db = app.database();
const auth = app.auth();

const PFAD_AUFGABEN = 'werkstattAufgaben';
const PFAD_INFO = 'infoboard';
const PFAD_AEMTER = 'aemter';
const PFAD_TERMINE = 'termine';
const ZURUECK_NACH_MS = 30000;          // ohne Berührung zurück auf heute
const NEULADEN_NACH_OFFLINE_MS = 120000; // Verbindung weg -> Seite neu laden

let state = {
  currentDate: new Date(),
  selectedDate: new Date(),
  employees: [],
  inactiveEmployees: [],
  employeeDates: {},
  vehicles: [],
  plans: {},
  aufgaben: {},
  infos: {},
  aemter: {},
  termine: {},
  ansicht: 'plan',       // 'plan', 'termine' oder 'aemtli'
  basisSkala: 1.6,
  schreibenGesperrt: null,
  offenerInfo: null,       // Eintrag, dessen Namensauswahl gerade offen ist
  offenerName: null,       // Name, dessen Fragen gerade ausgefüllt werden
  entwurf: null            // Antworten, solange sie nicht gespeichert sind
};

// ===== Hilfen =====
function dateKey(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),t=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+t;}
function getDayPlan(d){return state.plans[dateKey(d)]||{sites:[],globalStatus:{}};}
function istHeute(){return dateKey(state.selectedDate)===dateKey(new Date());}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDatum(iso){if(!iso)return '';const [y,m,t]=iso.split('-');return t+'.'+m+'.'+y;}
// Mehrtaegige Anlaesse: "12.–14.03.2027" im gleichen Monat, sonst beide Daten ganz
function fmtZeitraum(i){
  const a=(i&&i.datum)||'', b=(i&&i.datumBis)||'';
  if(!a)return fmtDatum(b);
  if(!b||b<=a)return fmtDatum(a);
  const [ya,ma,da]=a.split('-'), [yb,mb]=b.split('-');
  return (ya===yb&&ma===mb) ? da+'.–'+fmtDatum(b) : fmtDatum(a)+' – '+fmtDatum(b);
}

// Ein-/Austritt wie im Management: ausgetretene und noch nicht eingetretene ausblenden
function empDates(e){return (state.employeeDates||{})[e]||{};}
function istVersteckt(e,ref){
  const d=empDates(e);
  return (state.inactiveEmployees||[]).includes(e)
    || (!!d.austritt && d.austritt<=ref)
    || (!!d.eintritt && d.eintritt>ref);
}
function aktiveMitarbeiter(ref){return state.employees.filter(e=>!istVersteckt(e,ref));}

// ===== Skalierung =====
(function initSkala(){
  const p=new URLSearchParams(location.search).get('scale');
  let s=null;
  if(p&&!isNaN(parseFloat(p))){s=Math.min(5,Math.max(0.6,parseFloat(p)));try{localStorage.setItem('dashScale',String(s));}catch(e){}}
  else {try{const v=localStorage.getItem('dashScale');if(v)s=parseFloat(v);}catch(e){}}
  state.basisSkala = (s&&!isNaN(s)) ? s : 1.6;
  document.documentElement.style.setProperty('--s',String(state.basisSkala));
})();

// Ein Wandbildschirm wird nicht gescrollt. Passt der Tag nicht auf den Schirm,
// wird die ganze Darstellung verkleinert, bis alles sichtbar ist — lieber
// kleiner als unten abgeschnitten, denn eine fehlende Zeile fällt niemandem
// auf. An einem ruhigen Tag geht es wieder auf die eingestellte Grösse hoch.
function passeAnHoehe(){
  const w=document.documentElement;
  w.style.setProperty('--s',String(state.basisSkala));
  for(let i=0;i<10;i++){
    const ueber=Math.max(
      ueberlauf(document.getElementById('aufgabenListe')),
      ueberlauf(document.getElementById('infoListe')),
      ueberlauf(document.getElementById('aemtliListe')),
      ueberlauf(document.getElementById('termineListe')),
      document.body.scrollHeight-innerHeight
    );
    if(ueber<=1)return;
    const jetzt=parseFloat(getComputedStyle(w).getPropertyValue('--s'));
    const neu=Math.max(0.5, jetzt*(innerHeight-12)/(innerHeight+ueber));
    if(neu>=jetzt||neu<=0.5){w.style.setProperty('--s',String(Math.max(0.5,neu)));return;}
    w.style.setProperty('--s',String(neu));
  }
}
function ueberlauf(el){return el?el.scrollHeight-el.clientHeight:0;}


// Hoch- oder Querformat: im Querformat bleibt für das Infoboard kein
// sinnvoller Platz mehr, dort rücken die Bereiche enger zusammen.
function setzeFormat(){
  document.body.classList.toggle('quer', innerWidth > innerHeight);
}
addEventListener('resize', () => { setzeFormat(); zeichne(); });

// ===== Verbindung =====
let offlineSeit=null;
function setzeOnline(on){
  const p=document.getElementById('statusPunkt'), t=document.getElementById('statusText');
  if(!p)return;
  p.className='status-punkt '+(on?'on':'off');
  t.textContent = on ? (state.schreibenGesperrt?'Nur Ansicht':'Online') : 'Keine Verbindung';
  if(on) offlineSeit=null; else if(offlineSeit===null) offlineSeit=Date.now();
}
setInterval(()=>{ if(offlineSeit&&Date.now()-offlineSeit>NEULADEN_NACH_OFFLINE_MS) location.reload(); },10000);

// ===== Uhr und Mitternacht =====
let letzterTag=dateKey(new Date());
setInterval(()=>{
  const n=new Date(), el=document.getElementById('uhr');
  if(el) el.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  const heute=dateKey(n);
  if(heute!==letzterTag){letzterTag=heute;aufHeute();}
},1000);

// ===== Rücksprung auf heute =====
let rueckTimer=null, countdown=null;
function beruehrt(){
  clearTimeout(rueckTimer); clearInterval(countdown);
  // Zurück heisst: heutiger Tag UND der gewohnte Plan. Ein offener Reiter
  // zählt wie ein verstellter Tag.
  if(istHeute() && state.ansicht==='plan'){hinweis(null);return;}
  let rest=Math.round(ZURUECK_NACH_MS/1000);
  hinweis(rest);
  countdown=setInterval(()=>{rest--;if(rest>=0)hinweis(rest);},1000);
  rueckTimer=setTimeout(()=>{clearInterval(countdown);aufHeute();},ZURUECK_NACH_MS);
}
function hinweis(sek){
  const el=document.getElementById('rueckHinweis'); if(!el)return;
  if(sek===null){el.classList.remove('on');return;}
  el.classList.add('on');
  el.textContent=(state.ansicht==='plan'?'zurück zu heute in ':'zurück zum Plan in ')+sek+'s';
}
document.addEventListener('click',beruehrt);
document.addEventListener('touchstart',beruehrt,{passive:true});

// ===== Firebase =====
function listenerStarten(){
  db.ref('plans').on('value',s=>{state.plans=s.val()||{};zeichne();});
  db.ref('settings').on('value',s=>{
    const v=s.val();
    if(v){
      if(v.employees)state.employees=v.employees;
      if(v.vehicles)state.vehicles=v.vehicles;
      if(v.inactiveEmployees)state.inactiveEmployees=v.inactiveEmployees;
      state.employeeDates=v.employeeDates||{};
    }
    zeichne();
  });
  db.ref(PFAD_AUFGABEN).on('value',s=>{state.aufgaben=s.val()||{};zeichneAufgaben();passeAnHoehe();});
  db.ref(PFAD_INFO).on('value',s=>{
    state.infos=s.val()||{};
    zeichneInfo();
    if(state.offenerInfo && !state.offenerName) namenGitterFuellen();
    passeAnHoehe();
  });
  db.ref(PFAD_TERMINE).on('value',s=>{
    state.termine=s.val()||{};
    zeichneTermineHeute();
    if(state.ansicht==='termine')zeichneTermine();
    passeAnHoehe();
  });
  db.ref(PFAD_AEMTER).on('value',s=>{
    state.aemter=s.val()||{};
    zeichneAemtliHeute();
    if(state.ansicht==='aemtli')zeichneAemtli();
    passeAnHoehe();
  });
  db.ref('.info/connected').on('value',s=>setzeOnline(!!s.val()));
}

// ===== Tagesplan: eine Zeile pro Mitarbeiter =====
function zeichnePlan(){
  const d=state.selectedDate, plan=getDayPlan(d), ref=dateKey(d);
  const wochentage=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const monate=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  document.getElementById('wochentag').textContent=wochentage[d.getDay()];
  document.getElementById('datum').textContent=d.getDate()+'. '+monate[d.getMonth()]+' '+d.getFullYear();

  const leute=aktiveMitarbeiter(ref);
  const el=document.getElementById('planFit');
  const sites=plan.sites||[];
  if(leute.length===0||sites.length===0){
    el.style.transform='none';
    el.innerHTML='<div class="leer">'+(leute.length===0?'Keine Mitarbeiter hinterlegt.':'Für diesen Tag ist noch keine Baustelle geplant.')+'</div>';
    return;
  }

  const kopf=leute.map(emp=>{
    const gs=plan.globalStatus?.[emp]||'';
    const f = gs==='absent'?'var(--red)' : gs==='school'?'var(--blue)' : gs==='half'?'var(--yellow)' : 'var(--green)';
    return `<th><div class="kopf-wrap"><div class="kopf-name">${esc(emp)}</div><div class="kopf-punkt" style="background:${f}"></div></div></th>`;
  }).join('');

  const zeilen=sites.map(site=>{
    const vi=site.vehicle?site.vehicle-1:-1;
    const vn=vi>=0?(state.vehicles[vi]||''):'';
    const zellen=leute.map(emp=>{
      const gs=plan.globalStatus?.[emp]||'';
      const a=site.assignments?.[emp]||'';
      let c='mz', m='';
      if(gs==='absent'){c+=' s-absent'; m=a?esc(a):'—';}
      else if(gs==='school'){c+=' s-school'; m=a?esc(a):'S';}
      else if(gs==='half'){c+=' s-half'+(a?' drin':''); m=a?esc(a):'';}
      else {c+=(a?' drin':''); m=a?esc(a):'';}
      return `<td class="${c}">${m?`<span class="mark">${m}</span>`:''}</td>`;
    }).join('');
    return `<tr>
      <td><div class="bau">${site.name?esc(site.name):'<span class="bau-leer">Baustelle…</span>'}</div></td>
      <td class="fz-zelle">${vn?`<span class="fz">${esc(vn)}</span>`:''}</td>
      ${zellen}</tr>`;
  }).join('');

  el.innerHTML=`<table class="plan-table">
    <thead><tr><th class="sp-bau"><div class="sp-bau-inner"><img class="plan-logo" src="logo.jpg" alt="Elektra Ins AG"><span>Baustelle</span></div></th><th class="sp-fz">Fahrzeug</th>${kopf}</tr></thead>
    <tbody>${zeilen}</tbody></table>`;
  planAnpassen();
}

// Die Matrix wird fuer sich allein passend gerechnet: sie darf breiter und
// hoeher sein als ihr Kasten und wird dann heruntergerechnet. So bleibt der
// Platz darunter fuer Aufgaben und Infoboard unangetastet.
function planAnpassen(){
  const box=document.querySelector('.plan-box'), fit=document.getElementById('planFit');
  if(!box||!fit)return;
  fit.style.transform='none';
  const t=fit.querySelector('.plan-table'); if(!t)return;
  const bs=getComputedStyle(box);
  const bw=box.clientWidth - parseFloat(bs.paddingLeft) - parseFloat(bs.paddingRight);
  const bh=box.clientHeight - parseFloat(bs.paddingTop) - parseFloat(bs.paddingBottom);
  const tw=t.scrollWidth, th=t.scrollHeight;
  if(tw<=0||th<=0)return;
  const k=Math.min(1, bw/tw, bh/th);
  fit.style.transform = k<1 ? 'scale('+k+')' : 'none';
}
function aufHeute(){
  const n=new Date();
  state.selectedDate=n; state.currentDate=new Date(n.getFullYear(),n.getMonth(),1);
  clearTimeout(rueckTimer); clearInterval(countdown);
  if(state.ansicht!=='plan')ansichtWechseln('plan');
  zeichne();
}
function tagWechseln(r){
  const d=new Date(state.selectedDate); d.setDate(d.getDate()+r);
  state.selectedDate=d; state.currentDate=new Date(d.getFullYear(),d.getMonth(),1);
  zeichne();
}

// ===== Termine =====
// Anlässe mit festem Datum. Sie tauchen eine Woche vorher unten auf dem
// Startbildschirm auf, stehen am Tag selbst rot da und verschwinden danach
// von selbst — niemand muss sie wegräumen. Der Reiter zeigt alle, die noch
// kommen, auch die weiter entfernten.
const TERMIN_VORLAUF_TAGE = 7;
function terminListe(){
  return Object.entries(state.termine||{})
    .filter(([,t])=>t && t.datum)
    .sort((a,b)=>a[1].datum<b[1].datum?-1:a[1].datum>b[1].datum?1:(a[1].createdAt||0)-(b[1].createdAt||0));
}
// Ganze Tage bis zum Termin, von Mitternacht zu Mitternacht gerechnet —
// sonst hinge das Ergebnis an der Uhrzeit.
function tageBis(iso){
  const [y,m,d]=iso.split('-').map(Number);
  const n=new Date();
  return Math.round((new Date(y,m-1,d) - new Date(n.getFullYear(),n.getMonth(),n.getDate()))/86400000);
}
function terminWann(n){
  if(n===0)return 'heute';
  if(n===1)return 'morgen';
  if(n<0)return 'vorbei';
  return 'in '+n+' Tagen';
}
function kommendeTermine(){return terminListe().filter(([,t])=>tageBis(t.datum)>=0);}
function terminZeile(t){
  const n=tageBis(t.datum), [y,m,d]=t.datum.split('-');
  const wt=['So','Mo','Di','Mi','Do','Fr','Sa'][new Date(+y,+m-1,+d).getDay()];
  return '<div class="termin'+(n===0?' heute':'')+'">'
    +'<div class="termin-datum"><span class="termin-wt">'+wt+'</span>'+d+'.'+m+'.'+y+'</div>'
    +'<div class="termin-text"><div class="termin-titel">'+esc(t.titel||'')+'</div>'
    +(t.zeit?'<div class="termin-zeit">'+esc(t.zeit)+'</div>':'')+'</div>'
    +'<span class="chip'+(n===0?' rot':'')+'">'+terminWann(n)+'</span></div>';
}
// Unten am Startbildschirm nur, was innerhalb der nächsten Woche liegt.
function zeichneTermineHeute(){
  const el=document.getElementById('termineHeuteListe'); if(!el)return;
  const liste=kommendeTermine().filter(([,t])=>tageBis(t.datum)<=TERMIN_VORLAUF_TAGE);
  document.getElementById('blockTermine').style.display=liste.length?'flex':'none';
  el.innerHTML=liste.map(([,t])=>terminZeile(t)).join('');
  reiterAnpassen();
}
function zeichneTermine(){
  const el=document.getElementById('termineListe'); if(!el)return;
  const liste=kommendeTermine();
  document.getElementById('termineZahl').textContent=liste.length?liste.length+(liste.length===1?' Termin':' Termine'):'';
  el.innerHTML=liste.length?liste.map(([,t])=>terminZeile(t)).join('')
    :'<div class="leer">Keine Termine eingetragen.</div>';
}
// Ein Reiter ohne Inhalt führt ins Leere: er erscheint erst, wenn es etwas
// zu zeigen gibt, und schliesst sich, wenn der letzte Eintrag abläuft.
function reiterAnpassen(){
  const hatAemtli=aemterListe().length>0, hatTermine=kommendeTermine().length>0;
  const r=document.getElementById('reiter');
  const ba=document.getElementById('reiterAemtli'), bt=document.getElementById('reiterTermine');
  if(ba)ba.style.display=hatAemtli?'':'none';
  if(bt)bt.style.display=hatTermine?'':'none';
  if(r)r.style.display=(hatAemtli||hatTermine)?'flex':'none';
  if(state.ansicht==='aemtli'&&!hatAemtli)ansichtWechseln('plan');
  if(state.ansicht==='termine'&&!hatTermine)ansichtWechseln('plan');
}

// ===== Ämtli =====
// Wiederkehrende Posten mit Verantwortlichem und Stellvertreter. Anders als
// die Aufgaben werden sie nicht abgehakt — sie gelten jede Woche neu. Auf dem
// Startbildschirm steht darum nur, was am gezeigten Tag ansteht; die ganze
// Liste liegt hinter dem Reiter und fällt nach 30 s von selbst zurück.
const WOCHENTAGE=[['so','Sonntag'],['mo','Montag'],['di','Dienstag'],['mi','Mittwoch'],
                  ['do','Donnerstag'],['fr','Freitag'],['sa','Samstag']];
function wtKuerzel(d){return WOCHENTAGE[d.getDay()][0];}
function wtName(k){const t=WOCHENTAGE.find(w=>w[0]===k);return t?t[1]:'';}
function aemterListe(){
  return Object.entries(state.aemter||{}).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));
}
function amtZeile(a){
  return '<div class="amt">'
    +'<div class="amt-text"><div class="amt-titel">'+esc(a.titel||'')+'</div>'
    +(a.zeit?'<div class="amt-zeit">'+esc(a.zeit)+'</div>':'')+'</div>'
    +'<div class="amt-wer">'
    +(a.verantwortlich?'<span class="chip person">'+esc(a.verantwortlich)+'</span>':'')
    +(a.stv?'<span class="chip">Stv. '+esc(a.stv)+'</span>':'')
    +'</div></div>';
}
function zeichneAemtliHeute(){
  const el=document.getElementById('aemtliHeuteListe'); if(!el)return;
  const alle=aemterListe(), k=wtKuerzel(state.selectedDate);
  const liste=alle.filter(([,a])=>a.tag===k);
  document.getElementById('blockAemtliHeute').style.display = liste.length?'flex':'none';
  document.getElementById('aemtliHeuteTitel').textContent = 'Ämtli · '+wtName(k);
  el.innerHTML=liste.map(([,a])=>amtZeile(a)).join('');
  reiterAnpassen();
}
function zeichneAemtli(){
  const el=document.getElementById('aemtliListe'); if(!el)return;
  const alle=aemterListe(), heute=wtKuerzel(new Date());
  document.getElementById('aemtliZahl').textContent = alle.length?alle.length+' Ämtli':'';
  const reihen=WOCHENTAGE.slice(1).concat([WOCHENTAGE[0]]);   // Montag zuerst, Sonntag zuletzt
  let html='';
  reihen.forEach(([k,name])=>{
    const l=alle.filter(([,a])=>a.tag===k); if(!l.length)return;
    html+='<div class="amt-gruppe'+(k===heute?' heute':'')+'">'
      +'<div class="amt-tag">'+name+(k===heute?' · heute':'')+'</div>'
      +l.map(([,a])=>amtZeile(a)).join('')+'</div>';
  });
  const ohne=alle.filter(([,a])=>!WOCHENTAGE.some(w=>w[0]===a.tag));
  if(ohne.length)html+='<div class="amt-gruppe"><div class="amt-tag">Ohne festen Tag</div>'
    +ohne.map(([,a])=>amtZeile(a)).join('')+'</div>';
  el.innerHTML=html||'<div class="leer">Noch keine Ämtli erfasst.</div>';
}
function ansichtWechseln(v){
  state.ansicht=v;
  const seiten={plan:'ansichtPlan',termine:'ansichtTermine',aemtli:'ansichtAemtli'};
  Object.entries(seiten).forEach(([k,id])=>{
    const e=document.getElementById(id); if(!e)return;
    e.style.display = (k===v) ? (k==='plan'?'grid':'flex') : 'none';
  });
  [['plan','reiterPlan'],['termine','reiterTermine'],['aemtli','reiterAemtli']].forEach(([k,id])=>
    document.getElementById(id)?.classList.toggle('aktiv',k===v));
  // In den Listen blättert man keine Tage — die Pfeile verschwinden.
  const tn=document.querySelector('.tag-nav'); if(tn)tn.style.display = v==='plan'?'flex':'none';
  if(v==='aemtli')zeichneAemtli();
  if(v==='termine')zeichneTermine();
  beruehrt();
  passeAnHoehe();
  if(v==='plan')planAnpassen();
}

// ===== Aufgaben =====
function istSpaet(a){return !a.erledigt && !!a.termin && a.termin < dateKey(new Date());}
function personen(a){return Array.isArray(a.zugewiesen)?a.zugewiesen:(a.zugewiesen?[a.zugewiesen]:[]);}

function zeichneAufgaben(){
  const el=document.getElementById('aufgabenListe'); if(!el)return;
  const liste=Object.entries(state.aufgaben||{}).sort((a,b)=>{
    const A=a[1],B=b[1];
    if(!!A.erledigt!==!!B.erledigt)return A.erledigt?1:-1;
    const at=A.termin||'9999-99-99', bt=B.termin||'9999-99-99';
    if(at!==bt)return at<bt?-1:1;
    return (A.createdAt||0)-(B.createdAt||0);
  });
  const offen=liste.filter(([,a])=>!a.erledigt).length;
  document.getElementById('aufgabenZahl').textContent =
    liste.length===0 ? '' : offen+' offen'+(liste.length-offen?' · '+(liste.length-offen)+' erledigt':'');

  document.getElementById('blockAufgaben').style.display = liste.length===0 ? 'none' : 'flex';
  if(liste.length===0){el.innerHTML='';return;}

  el.innerHTML=liste.map(([id,a])=>{
    const p=personen(a), spaet=istSpaet(a);
    const wann = a.erledigt&&a.erledigtAm
      ? `<div class="auf-wann">erledigt ${new Date(a.erledigtAm).toLocaleDateString('de-CH')} um ${new Date(a.erledigtAm).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})}</div>` : '';
    return `<div class="auf${a.erledigt?' fertig':''}${spaet?' spaet':''}" onclick="aufgabeUmschalten('${id}')">
      <div class="auf-haken">✓</div>
      <div class="auf-text">
        <div class="auf-titel">${esc(a.titel||'')}</div>
        ${a.beschreibung?`<div class="auf-besch">${esc(a.beschreibung)}</div>`:''}
        ${wann}
      </div>
      <div class="auf-meta">
        ${a.termin?`<span class="chip${spaet?' rot':''}">bis ${fmtDatum(a.termin)}</span>`:''}
        ${p.map(n=>`<span class="chip person">${esc(n)}</span>`).join('')}
      </div>
    </div>`;
  }).join('');
}

// Abhaken und zurückholen sind dieselbe Geste: nochmal antippen macht es
// rückgängig. Ein versehentlicher Haken soll niemanden zum Laptop zwingen.
function aufgabeUmschalten(id){
  const a=(state.aufgaben||{})[id]; if(!a)return;
  if(state.schreibenGesperrt){meldung('Nicht möglich – '+state.schreibenGesperrt,'err');return;}
  const neu=!a.erledigt;
  db.ref(PFAD_AUFGABEN+'/'+id).update({erledigt:neu,erledigtAm:neu?Date.now():null})
    .then(()=>meldung(neu?'✓ Erledigt':'Wieder offen','ok'))
    .catch(e=>meldung('Nicht gespeichert: '+e.message,'err'));
}

// ===== Infoboard =====
// Eine Mitteilung ist zunächst nur Text. Ist "anmeldung" gesetzt, kommt eine
// Namensliste dazu, in die sich am Bildschirm jeder selbst einträgt.
function infoSichtbar(i){
  const heute=dateKey(new Date());
  return !i.bis || i.bis >= heute;     // abgelaufene blenden sich selbst aus
}

function zeichneInfo(){
  const el=document.getElementById('infoListe'); if(!el)return;
  const liste=Object.entries(state.infos||{})
    .filter(([,i])=>infoSichtbar(i))
    .sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));

  document.getElementById('infoZahl').textContent = liste.length? liste.length+(liste.length===1?' Mitteilung':' Mitteilungen') : '';
  document.getElementById('blockInfo').style.display = liste.length===0 ? 'none' : 'flex';
  if(liste.length===0){el.innerHTML='';return;}

  el.innerHTML=liste.map(([id,i])=>{
    const t=tnNamen(i), aus=auswertung(i);
    // Wer Fragen stellt, will Antworten: eine Mitteilung mit Fragen bekommt
    // die Namensliste auch dann, wenn der Haken beim Erfassen fehlte.
    const anmeldung = (i.anmeldung || felderVon(i).length) ? `<div class="info-anmeldung">
        <button class="knopf" onclick="namenAuswahl('${id}')">An- / Abmelden</button>
        <span class="chip">${t.length} angemeldet</span>
        <div class="info-namen">${t.map(n=>`<span class="chip person">${esc(n)}</span>`).join('')}</div>
      </div>
      ${aus.length?`<div class="aus">${aus.map(a=>`<span class="chip">${esc(a.label)}: ${esc(a.text)}</span>`).join('')}</div>`:''}` : '';
    return `<div class="info">
      <div class="info-kopf">
        <span class="info-titel">${esc(i.titel||'')}</span>
        ${(i.datum||i.datumBis)?`<span class="chip">${fmtZeitraum(i)}</span>`:''}
      </div>
      ${i.text?`<div class="info-text">${esc(i.text)}</div>`:''}
      ${anmeldung}
    </div>`;
  }).join('');
}

// Eine Mitteilung kann eigene Fragen tragen — "Partner ja/nein", "welche Tage",
// "Halbtax". Ohne Fragen bleibt es beim einfachen Antippen des Namens.
function felderVon(i){return Array.isArray(i&&i.felder)?i.felder:[];}
function tnDaten(i,name){
  const v=(i.teilnehmer||{})[schluessel(name)];
  if(v==null)return null;
  if(typeof v==='number')return {ts:v,antworten:{}};   // alte Eintraege ohne Fragen
  return {ts:v.ts||0,antworten:v.antworten||{}};
}
function tnNamen(i){return Object.keys(i.teilnehmer||{});}

// Fuer die Wand zaehlt nicht die Einzelantwort, sondern die Summe: wie viele
// mit Partner, wie viele brauchen ein Skiabo.
function auswertung(i){
  const fs=felderVon(i); if(!fs.length)return [];
  const alle=Object.values(i.teilnehmer||{});
  return fs.map(f=>{
    const z={};
    alle.forEach(v=>{
      const a=(v&&typeof v==='object'&&v.antworten)?v.antworten[f.id]:null;
      if(a)z[a]=(z[a]||0)+1;
    });
    const teile=Object.entries(z).map(([k,c])=>k+' '+c);
    return teile.length?{label:f.label,text:teile.join(' · ')}:null;
  }).filter(Boolean);
}

function namenAuswahl(id){
  if(state.schreibenGesperrt){meldung('Nicht möglich – '+state.schreibenGesperrt,'err');return;}
  state.offenerInfo=id; state.offenerName=null; state.entwurf=null;
  const i=(state.infos||{})[id]; if(!i)return;
  document.getElementById('dialogTitel').textContent=i.titel||'Anmeldung';
  namenGitterFuellen();
  document.getElementById('overlay').classList.add('on');
}

function namenGitterFuellen(){
  const id=state.offenerInfo; if(!id)return;
  const i=(state.infos||{})[id]; if(!i){dialogSchliessen();return;}
  const leute=aktiveMitarbeiter(dateKey(new Date()));
  const mitFragen=felderVon(i).length>0;
  document.getElementById('dialogSub').textContent = mitFragen
    ? 'Namen antippen, dann die Fragen beantworten.'
    : 'Namen antippen zum An- und Abmelden.';
  document.getElementById('dialogKoerper').innerHTML =
    '<div class="namen-gitter">'+leute.map(nm=>{
      const d=tnDaten(i,nm);
      return '<button class="name-knopf'+(d?' drin':'')+'" onclick="nameGewaehlt(\''+esc(nm).replace(/'/g,"\\'")+'\')">'+esc(nm)+'</button>';
    }).join('')+'</div>';
  document.getElementById('dialogFuss').innerHTML =
    '<span></span><button class="knopf" onclick="dialogSchliessen()">Fertig</button>';
}

function nameGewaehlt(name){
  const i=(state.infos||{})[state.offenerInfo]; if(!i)return;
  const fs=felderVon(i);
  if(!fs.length){ anmeldungUmschalten(name); return; }   // ohne Fragen wie bisher
  const d=tnDaten(i,name);
  state.offenerName=name;
  state.entwurf=Object.assign({}, d?d.antworten:{});
  // Vorbelegen, damit nie eine Frage unbeantwortet gespeichert wird
  fs.forEach(f=>{ if(!state.entwurf[f.id]) state.entwurf[f.id]=optionenVon(f)[0]; });
  fragenZeigen();
}

function optionenVon(f){
  if(f.typ==='auswahl'&&Array.isArray(f.optionen)&&f.optionen.length)return f.optionen;
  return ['Ja','Nein'];
}

function fragenZeigen(){
  const i=(state.infos||{})[state.offenerInfo]; if(!i)return;
  const name=state.offenerName, d=tnDaten(i,name);
  document.getElementById('dialogSub').textContent=name+' – bitte ausfüllen';
  document.getElementById('dialogKoerper').innerHTML=felderVon(i).map(f=>{
    const opts=optionenVon(f).map(o=>
      '<button class="opt'+(state.entwurf[f.id]===o?' sel':'')+'" onclick="antwortSetzen(\''+esc(f.id)+'\',\''+esc(o).replace(/'/g,"\\'")+'\')">'+esc(o)+'</button>'
    ).join('');
    return '<div class="frage"><div class="frage-label">'+esc(f.label)+'</div><div class="frage-opts">'+opts+'</div></div>';
  }).join('');
  document.getElementById('dialogFuss').innerHTML =
    (d ? '<button class="knopf leise" onclick="abmelden()">Abmelden</button>' : '<button class="knopf leise" onclick="namenGitterFuellen()">Zurück</button>')
    + '<button class="knopf" onclick="anmeldungSpeichern()">Speichern</button>';
}

function antwortSetzen(fid,wert){
  if(!state.entwurf)return;
  state.entwurf[fid]=wert;
  fragenZeigen();
}

// Firebase-Schlüssel dürfen . $ # [ ] / nicht enthalten — Namen wie "Reto B."
// würden den Pfad sprengen, deshalb vorher ersetzen.
function schluessel(name){return name.replace(/[.$#\[\]\/]/g,'_');}

function anmeldungSpeichern(){
  const id=state.offenerInfo, name=state.offenerName;
  if(!id||!name)return;
  db.ref(PFAD_INFO+'/'+id+'/teilnehmer/'+schluessel(name)).set({ts:Date.now(),antworten:state.entwurf||{}})
    .then(()=>{meldung(name+' angemeldet','ok');namenGitterFuellen();})
    .catch(e=>meldung('Nicht gespeichert: '+e.message,'err'));
}

function abmelden(){
  const id=state.offenerInfo, name=state.offenerName;
  if(!id||!name)return;
  db.ref(PFAD_INFO+'/'+id+'/teilnehmer/'+schluessel(name)).set(null)
    .then(()=>{meldung(name+' abgemeldet','ok');namenGitterFuellen();})
    .catch(e=>meldung('Nicht gespeichert: '+e.message,'err'));
}

// Mitteilungen ohne Fragen: Antippen meldet an und wieder ab.
function anmeldungUmschalten(name){
  const id=state.offenerInfo; if(!id)return;
  const i=(state.infos||{})[id]; if(!i)return;
  const drin=!!tnDaten(i,name);
  db.ref(PFAD_INFO+'/'+id+'/teilnehmer/'+schluessel(name)).set(drin?null:{ts:Date.now(),antworten:{}})
    .then(()=>meldung(drin?name+' abgemeldet':name+' angemeldet','ok'))
    .catch(e=>meldung('Nicht gespeichert: '+e.message,'err'));
}

function dialogSchliessen(){
  state.offenerInfo=null; state.offenerName=null; state.entwurf=null;
  document.getElementById('overlay').classList.remove('on');
}
// ===== Zeichnen =====
function zeichne(){
  zeichnePlan();
  zeichneAemtliHeute();
  zeichneAufgaben();
  zeichneInfo();
  zeichneTermineHeute();
  if(state.ansicht==='aemtli')zeichneAemtli();
  if(state.ansicht==='termine')zeichneTermine();
  passeAnHoehe();
  planAnpassen();
  if(!istHeute() || state.ansicht!=='plan') beruehrt(); else hinweis(null);
}

function meldung(txt,art){
  const el=document.getElementById('toast');
  el.className='toast '+(art||''); el.textContent=txt; el.style.display='block';
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',2600);
}

// ===== Start =====
// Anonyme Anmeldung: der Bildschirm braucht ein Konto, um Haken und
// Anmeldungen speichern zu dürfen, aber niemand soll an der Wand ein Passwort
// eintippen. Scheitert sie, startet die App trotzdem — lesen geht ohne
// Anmeldung, und ein Bildschirm, der gar nichts zeigt, ist schlimmer als
// einer, der den Plan zeigt und beim Antippen Bescheid gibt.
function nurAnsicht(){
  const t=document.getElementById('statusText'); if(t)t.textContent='Nur Ansicht';
  meldung('Nur Ansicht – '+state.schreibenGesperrt,'err');
}
// Verliert der Bildschirm seine Anmeldung (Konto aufgeräumt, Token abgelaufen),
// meldet er sich von selbst neu an. Erst nach der ersten Anmeldung einhängen,
// sonst feuert der Listener sofort mit "kein Nutzer" und meldet doppelt an.
function ueberwacheAnmeldung(){
  auth.onAuthStateChanged(u=>{
    if(u||state.schreibenGesperrt)return;
    auth.signInAnonymously().catch(e=>{state.schreibenGesperrt=e.message;nurAnsicht();});
  });
}
function start(){
  setzeFormat();
  auth.signInAnonymously()
    .catch(e=>{
      state.schreibenGesperrt = (e.code==='auth/admin-restricted-operation')
        ? 'anonyme Anmeldung ist in der Firebase-Konsole nicht aktiviert'
        : e.message;
    })
    .then(()=>{
      listenerStarten();
      document.getElementById('loader').style.display='none';
      document.getElementById('shell').style.display='flex';
      zeichne();
      if(state.schreibenGesperrt) nurAnsicht(); else ueberwacheAnmeldung();
    });
}
start();
</script>
